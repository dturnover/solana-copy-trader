name: Consensus Replay

# Does a coin go up after several KOLs buy it within minutes?
# (reports/replay_consensus.py). Daily while the test is young -- each day
# is fresh out-of-sample data. Drop to weekly once it has an answer.
on:
  schedule:
    - cron: "20 11 * * *"   # clear of the Monday jobs (all done by ~10:00)
  workflow_dispatch: {}
  push:
    branches: ["fix/**"]
    paths:
      - "reports/replay_consensus.py"
      - ".github/workflows/consensus.yml"

permissions:
  contents: write

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: pip install --quiet pandas numpy
      - name: Replay consensus signals
        env:
          RPC_ENDPOINT: https://rpc.shyft.to?api_key=${{ secrets.SHYFT_API_KEY }}
        run: |
          set -o pipefail
          python3 reports/replay_consensus.py 2>&1 | tee consensus.txt
      - name: Publish to the run summary
        if: always()
        run: |
          { echo '```'; tail -40 consensus.txt 2>/dev/null || echo "(no output)"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Commit
        if: github.ref == 'refs/heads/master'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/consensus 2>/dev/null || true
          git diff --staged --quiet && { echo "nothing new"; exit 0; }
          git commit -m "Consensus pricing $(date -u +%Y-%m-%d) [skip ci]"
          for attempt in 1 2 3 4; do
            git pull --rebase --quiet origin master && git push origin HEAD:master && break
            sleep $((attempt * 2))
          done
