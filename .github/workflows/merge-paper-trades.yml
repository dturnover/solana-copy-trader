name: Merge Paper Trades

# Folds paper-trade.yml's and lag-experiment.yml's uploaded artifacts into the
# committed datasets at reports/paper_trades_final.csv and
# reports/lag_samples_final.csv.
#
# paper-trade.yml only uploads its CSV as a build artifact, which expires
# after 90 days and can't be queried as data. Until 2026-08 the dataset was
# refreshed by hand (download artifacts locally, dedupe, commit), so it
# silently drifted days behind the pipeline whenever nobody got around to
# it -- the committed file sat at 2026-07-31 with five completed runs
# unmerged. This closes that loop automatically.
on:
  # Fires when a Paper Trade run finishes, so the dataset tracks the
  # pipeline without anyone remembering to merge.
  workflow_run:
    workflows: ["Paper Trade", "Lag Experiment"]
    types: [completed]
  workflow_dispatch: {}

permissions:
  contents: write   # commits the refreshed dataset
  actions: read     # lists/downloads artifacts from other runs

# A merge is a read-all/write-one operation on a single tracked file, so two
# at once would race on the same push. Queue them instead of cancelling:
# cancel-in-progress would drop a merge whose artifacts nothing else re-reads
# until the next run.
concurrency:
  group: merge-paper-trades
  cancel-in-progress: false

jobs:
  merge:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPO: ${{ github.repository }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Python deps
        run: pip install --quiet pandas

      # Deliberately downloads *every* unexpired paper-trades-* artifact, not
      # just those newer than the dataset's last row. Artifact retention is
      # the real bound (90d, ~4 runs/day, tens of KB each), and dedupe is
      # exact on the on-chain sell_signature, so re-reading old artifacts
      # costs a little bandwidth and buys self-healing: any run that was
      # missed, or merged while a previous job was failing, gets backfilled
      # on the next merge instead of being lost for good. Filtering by date
      # would reintroduce exactly the silent-gap failure this workflow exists
      # to prevent.
      - name: Download artifacts
        run: |
          mkdir -p artifacts/paper artifacts/lag
          download_set() {
            prefix="$1"; dest="$2"
            gh api --paginate "repos/$REPO/actions/artifacts" \
              --jq ".artifacts[] | select(.name | startswith(\"$prefix\")) | select(.expired == false) | .id" \
              > "ids_${dest}.txt"
            echo "Found $(wc -l < "ids_${dest}.txt") unexpired ${prefix}* artifact(s)"
            # A single artifact failing to download (transient 5xx, or one
            # that expired between the listing above and now) must not sink
            # the whole merge -- the rest still carry recoverable data.
            while read -r id; do
              [ -z "$id" ] && continue
              if gh api "repos/$REPO/actions/artifacts/$id/zip" > "artifacts/$id.zip" 2>/dev/null; then
                unzip -o -q "artifacts/$id.zip" -d "artifacts/$dest/$id" && rm -f "artifacts/$id.zip"
              else
                echo "  WARN: artifact $id could not be downloaded, skipping"
                rm -f "artifacts/$id.zip"
              fi
            done < "ids_${dest}.txt"
          }
          download_set "paper-trades-" paper
          download_set "lag-samples-" lag

      # The paper-trade dataset is the primary artifact of this repo, so its
      # merge gets its own step. Bundling it with the lag merge meant one
      # strict schema check on the SECONDARY dataset aborted the shared step
      # under `set -e`, skipping the commit and stranding three days of
      # successfully-merged trade data (2026-08-05..08).
      - name: Merge paper trades
        run: |
          python3 reports/merge_artifacts.py \
            reports/paper_trades_final.csv artifacts/paper /tmp/combined_raw.csv
          python3 reports/dedupe_and_clean.py \
            /tmp/combined_raw.csv reports/paper_trades_final.csv

      # continue-on-error: a lag-sample problem is worth seeing (the step goes
      # red) but must never again block the trade dataset from being committed.
      - name: Merge lag samples
        continue-on-error: true
        run: |
          python3 reports/merge_lag_samples.py \
            /tmp/lag_samples_raw.csv artifacts/lag reports/lag_curve.csv

      # Every run re-reads every artifact, so most merges legitimately
      # produce no change (nothing new closed since last time). Committing
      # unconditionally would push an empty commit 4x/day.
      - name: Commit refreshed dataset
        run: |
          if git diff --quiet -- reports/paper_trades_final.csv reports/lag_curve.csv; then
            echo "No new closed trades since the last merge -- nothing to commit."
            exit 0
          fi
          # "clean" is no longer the same as "all rows": blow-up fills are
          # retained and flagged rather than dropped, so report both numbers
          # instead of labelling the total as clean.
          read -r TOTAL CLEAN BLOW < <(python3 -c "
          import pandas as pd
          d = pd.read_csv('reports/paper_trades_final.csv')
          b = int(d['blowup'].sum()) if 'blowup' in d.columns else 0
          print(len(d), len(d) - b, b)")
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Size guard. A single oversized file gets rejected by the remote
          # and takes every other file in the commit with it -- which is how
          # the lag samples blocked the trade dataset. Skip it loudly instead.
          for f in reports/paper_trades_final.csv reports/lag_curve.csv; do
            [ -f "$f" ] || continue
            SIZE=$(stat -c%s "$f")
            if [ "$SIZE" -gt 52428800 ]; then
              echo "WARN: $f is $((SIZE / 1048576))MB -- too large to track, not staging it."
              continue
            fi
            git add "$f"
          done
          LAG=0
          [ -f reports/lag_curve.csv ] && LAG=$(($(wc -l < reports/lag_curve.csv) - 1))
          git commit -m "Refresh datasets: ${TOTAL} closed trades (${CLEAN} clean, ${BLOW} blow-up), ${LAG} lag buckets [skip ci]"
          # The scheduled paper-trade.yml pushes nothing, but a concurrent
          # manual commit to this branch would make a bare push fail; rebase
          # onto whatever landed rather than dropping this merge.
          for attempt in 1 2 3; do
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              exit 0
            fi
            echo "Push failed (attempt ${attempt}), rebasing on latest and retrying..."
            git pull --rebase origin "${GITHUB_REF_NAME}" || exit 1
          done
          echo "ERROR: could not push refreshed dataset after 3 attempts"
          exit 1
