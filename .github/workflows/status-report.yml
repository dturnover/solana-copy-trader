name: Status Report

# Commits STATUS.md: what the experiment has FOUND.
#
# ci-health-check.yml has run 158 times reporting whether the jobs failed, and
# nothing has ever reported whether any of this is working. Answering "how is
# it going" has required someone to go and assemble it by hand every time,
# which means it only got answered when asked.
#
# Twice a day, into a file in the repo root, readable on a phone.
on:
  schedule:
    - cron: "15 7,19 * * *"
  # Also right after new data lands, so the file is never stale relative to
  # the dataset it describes.
  workflow_run:
    workflows: ["Merge Paper Trades"]
    types: [completed]
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: status-report
  cancel-in-progress: false

jobs:
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Install deps
        run: pip install --quiet pandas numpy

      - name: Generate status
        run: |
          # Without pipefail a crashed script would still commit whatever
          # STATUS.md happened to be on disk -- i.e. yesterday's, silently.
          set -o pipefail
          python3 reports/status.py | tee status.txt

      - name: Publish to the run summary
        if: always()
        run: cat STATUS.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || echo "(no status generated)" >> "$GITHUB_STEP_SUMMARY"

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add STATUS.md reports/.status_prev.json
          git diff --staged --quiet && { echo "unchanged"; exit 0; }
          git commit -m "Status: $(date -u +%Y-%m-%d\ %H:%M) UTC [skip ci]"
          for attempt in 1 2 3 4; do
            git pull --rebase --quiet origin master && git push origin HEAD:master && break
            echo "push failed (attempt ${attempt}), retrying"
            sleep $((attempt * 2))
          done
