name: Paper Trade

# Runs the free paper_trade tool for a few hours at a time on GitHub's
# hosted runners -- tracks tracked wallets' real buy/sell round trips and
# computes both their real P&L and our simulated copy-trade P&L at an
# assumed execution lag. Research instrument, not a production service, so
# bounded scheduled runs (not a true daemon) are the right shape.
on:
  schedule:
    - cron: "30 */6 * * *" # every 6 hours, offset 30m from lag-experiment.yml
  workflow_dispatch: {}

jobs:
  run-experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - uses: actions/checkout@v4

      # Wall-clock anchor for the dynamic budget computed just before "Run
      # paper trade experiment" below -- see that step for why a fixed `5h`
      # isn't safe here.
      - name: Record job start time
        run: echo "JOB_START_EPOCH=$(date +%s)" >> "$GITHUB_ENV"

      # A prior run hit "No space left on device" at the final link step --
      # the default runner's free disk is smaller than it looks once vcpkg's
      # build artifacts (grpc/protobuf/openssl, several hundred MB each
      # across 3 statically-linked executables) pile up. Free the large
      # preinstalled SDKs we never use before touching any of that.
      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          sudo docker image prune -af || true
          df -h /

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake ninja-build curl zip unzip tar pkg-config

      # Pinned to the same commit as vcpkg.json's builtin-baseline (see the
      # comment there for why: an unpinned `git clone` of vcpkg's default
      # branch floats forward on every run, and when upstream bumps a port
      # recipe -- e.g. grpc/protobuf -- our binary cache silently stops
      # matching ("Restored 0 package(s)...") and every run pays a ~1h+
      # from-source rebuild forever, since the cache is keyed only on
      # vcpkg.json's *contents*, which never changes. That's what caused the
      # "No space left on device" failures and 5h50m job-timeout
      # cancellations starting 2026-07-23: a from-scratch grpc/protobuf
      # rebuild ate the runner's disk before the link step, or ate enough of
      # the 350min job budget that the 5h in-process timeout below never got
      # a chance to exit cleanly. Bump VCPKG_COMMIT (and vcpkg.json's
      # builtin-baseline to match) deliberately when you want newer ports --
      # never let it drift on its own.
      - name: Set vcpkg pin
        run: echo "VCPKG_COMMIT=40f3c709db80acf154ac4b17a1f83c564ebd022e" >> "$GITHUB_ENV"

      - name: Cache vcpkg archives
        uses: actions/cache@v4
        with:
          path: ~/.cache/vcpkg/archives
          key: vcpkg-archives-${{ runner.os }}-${{ env.VCPKG_COMMIT }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            vcpkg-archives-${{ runner.os }}-${{ env.VCPKG_COMMIT }}-

      - name: Bootstrap vcpkg
        run: |
          git init "$HOME/vcpkg"
          git -C "$HOME/vcpkg" fetch --depth 1 https://github.com/microsoft/vcpkg.git "$VCPKG_COMMIT"
          git -C "$HOME/vcpkg" checkout FETCH_HEAD
          "$HOME/vcpkg/bootstrap-vcpkg.sh"
          echo "VCPKG_ROOT=$HOME/vcpkg" >> "$GITHUB_ENV"

      - name: Configure
        run: cmake -B build -S . -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake"

      # Reclaim space before the link step -- buildtrees (intermediate
      # object files/source unpacks) aren't needed once packages are
      # installed, and on a cache-miss run (rebuilding grpc/protobuf/openssl
      # from source) can be gigabytes, large enough to starve the static
      # link step for 3 executables that immediately follows. Cleaning here,
      # right after Configure/before Build, protects against that even if
      # the pin above is ever bumped and pays a one-time rebuild cost again.
      - name: Clean up build intermediates
        run: rm -rf "$VCPKG_ROOT/buildtrees" "$VCPKG_ROOT/downloads" && df -h /

      - name: Build
        run: cmake --build build -j"$(nproc)"

      - name: Generate config.json from CI template (injects secret at runtime, never committed)
        run: sed "s#SHYFT_API_KEY_PLACEHOLDER#${{ secrets.SHYFT_API_KEY }}#g" config/config.paper_trade.ci.json > config/config.json

      # A flat `timeout 5h` here was the second half of the vcpkg-cache-
      # staleness incident, not just a symptom of it: on a cache-miss run,
      # Configure alone can take 70-90min, so 5h *more* for the experiment
      # pushes total job time past timeout-minutes (350) and GitHub
      # force-cancels the whole job -- which means actions/cache's own
      # post-job save step never runs either, so the freshly-rebuilt cache
      # is silently lost and the NEXT run pays the same 70-90min rebuild
      # again, forever. No fixed number here is both safe on a cold-cache
      # run and near-optimal on a warm one, so compute the experiment's
      # budget from whatever's actually left: total job ceiling minus
      # elapsed setup time minus a safety margin reserved for upload/cache-
      # save/cleanup after the experiment stops. This guarantees the job
      # itself always finishes on its own (cache gets to save, breaking the
      # loop) while still using the full ~5h in the normal warm-cache case.
      - name: Compute experiment time budget
        run: |
          TOTAL_BUDGET_SECONDS=$((335 * 60))   # stay safely under the 350min job timeout
          SAFETY_MARGIN_SECONDS=$((15 * 60))   # reserved for upload + cache save + cleanup after
          MIN_RUN_SECONDS=$((10 * 60))         # always attempt at least a short run
          ELAPSED=$(( $(date +%s) - JOB_START_EPOCH ))
          REMAINING=$(( TOTAL_BUDGET_SECONDS - ELAPSED - SAFETY_MARGIN_SECONDS ))
          if [ "$REMAINING" -lt "$MIN_RUN_SECONDS" ]; then
            echo "Only ${REMAINING}s left after setup (elapsed=${ELAPSED}s) -- setup ate most of the budget (cold vcpkg cache?). Falling back to a ${MIN_RUN_SECONDS}s minimum run."
            REMAINING=$MIN_RUN_SECONDS
          fi
          echo "EXPERIMENT_BUDGET_SECONDS=$REMAINING" >> "$GITHUB_ENV"
          echo "Setup took ${ELAPSED}s; running the experiment for ${REMAINING}s (~$((REMAINING / 60))min)"

      # -k 30s: if the process ignores/is slow to respond to SIGTERM at the
      # computed budget, force SIGKILL 30s later rather than relying on the
      # job-level timeout-minutes cap (which cancels the whole job, cache
      # save included -- see above).
      - name: Run paper trade experiment
        run: timeout -k 30s "${EXPERIMENT_BUDGET_SECONDS}s" ./build/paper_trade config/config.json || true

      - name: Upload collected trades
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: paper-trades-${{ github.run_id }}
          path: paper_trades.csv
          if-no-files-found: warn
