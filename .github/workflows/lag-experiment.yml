name: Lag Experiment

# Runs the free lag_experiment tool for a few hours at a time on GitHub's
# hosted runners instead of needing a home PC left on -- this is a research
# instrument collecting price-decay samples, not a production service, so
# bounded scheduled runs are the right shape rather than a true daemon.
on:
  schedule:
    - cron: "0 */6 * * *" # every 6 hours
  workflow_dispatch: {} # allows manual triggering via `gh workflow run` or the Actions UI

jobs:
  run-experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 350 # comfortably under the 6h hard cap for hosted runners

    steps:
      - uses: actions/checkout@v4

      # A prior run hit "No space left on device" at the final link step --
      # the default runner's free disk is smaller than it looks once vcpkg's
      # build artifacts (grpc/protobuf/openssl, several hundred MB each
      # across 3 statically-linked executables) pile up. Free the large
      # preinstalled SDKs we never use before touching any of that.
      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          sudo docker image prune -af || true
          df -h /

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake ninja-build curl zip unzip tar pkg-config

      # vcpkg's own binary cache -- without this, every scheduled run would
      # rebuild grpc/protobuf/curl from source (30-60+ min). With it, only
      # the first run after a vcpkg.json change pays that cost.
      - name: Cache vcpkg archives
        uses: actions/cache@v4
        with:
          path: ~/.cache/vcpkg/archives
          key: vcpkg-archives-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            vcpkg-archives-${{ runner.os }}-

      - name: Bootstrap vcpkg
        run: |
          git clone --depth 1 https://github.com/microsoft/vcpkg.git "$HOME/vcpkg"
          "$HOME/vcpkg/bootstrap-vcpkg.sh"
          echo "VCPKG_ROOT=$HOME/vcpkg" >> "$GITHUB_ENV"

      - name: Configure
        run: cmake -B build -S . -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake"

      - name: Build
        run: cmake --build build -j"$(nproc)"

      - name: Clean up build intermediates
        run: rm -rf "$VCPKG_ROOT/buildtrees" "$VCPKG_ROOT/downloads" && df -h /

      - name: Generate config.json from CI template (injects secret at runtime, never committed)
        run: sed "s#SHYFT_API_KEY_PLACEHOLDER#${{ secrets.SHYFT_API_KEY }}#g" config/config.ci.json > config/config.json

      # -k 30s: guarantees SIGKILL 30s after SIGTERM if the process doesn't
      # exit on its own, instead of potentially running until the job-level
      # timeout-minutes cap kills the whole job (seen in at least two prior
      # runs -- cancelled at 5h50m instead of exiting cleanly at 5h).
      - name: Run lag experiment
        run: timeout -k 30s 5h ./build/lag_experiment config/config.json || true

      - name: Upload collected samples
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lag-samples-${{ github.run_id }}
          path: lag_samples_kol.csv
          if-no-files-found: warn
