name: Discover Wallets

# Ranks candidate wallets for a tracking slot from pump.fun's own trade events
# (reports/discover_wallets.py). Manual, and on fix/** pushes that touch it.
# Shares the collector's RPC key; the collector retries rate-limited calls,
# and this paces itself.
on:
  # Daily: fresh candidates, plus a re-screen of every earlier stage-2 passer
  # (the watchlist), so evidence on them accumulates day over day.
  schedule:
    - cron: "40 7 * * *"
  workflow_dispatch: {}
  push:
    branches: ["fix/**"]
    paths:
      - "reports/discover_wallets.py"
      - "reports/fetch_kolscan.py"
      - ".github/workflows/discover-wallets.yml"

permissions:
  contents: write   # the ranking is committed: the history behind it expires

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: pip install --quiet pandas
      # Screen the KOLs people actually follow (kolscan.io leaderboard), not
      # random program traffic. Falls back to random sampling if the fetch
      # finds nobody, so a site change cannot silently empty the screen.
      - name: Fetch kolscan.io wallets
        run: |
          set -o pipefail
          python3 reports/fetch_kolscan.py reports/screened/kolscan_wallets.json 2>&1 | tail -5 || true
      - name: Discover and profile
        env:
          RPC_ENDPOINT: https://rpc.shyft.to?api_key=${{ secrets.SHYFT_API_KEY }}
        run: |
          set -o pipefail
          if [ -s reports/screened/kolscan_wallets.json ] && grep -q pubkey reports/screened/kolscan_wallets.json; then
            SRC="--wallets-json reports/screened/kolscan_wallets.json"
          else
            echo "::warning::kolscan fetch found no wallets -- falling back to random sampling"
            SRC="--top 40"
          fi
          python3 reports/discover_wallets.py $SRC 2>&1 | tee discover.txt
      - name: Publish to the run summary
        if: always()
        run: |
          { echo '```'; tail -60 discover.txt 2>/dev/null || echo "(no output)"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Commit ranking
        if: github.ref == 'refs/heads/master'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/screened/discovered_*.csv reports/screened/kolscan_wallets.json
          git diff --staged --quiet && exit 0
          git commit -m "Wallet discovery $(date -u +%Y-%m-%d) [skip ci]"
          for attempt in 1 2 3 4; do
            git pull --rebase --quiet origin master && git push origin HEAD:master && break
            sleep $((attempt * 2))
          done
